[tool.ruff]
target-version = "py312"
line-length = 79
src = ["backend"]
extend-exclude = [
  "**/migrations/**",
  "backend/staticfiles/**",
]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "B",      # bugbear
  "UP",     # pyupgrade
  "TID",    # tidy imports
]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = [
  "config",
  "accounts",
  "courses",
  "subscriptions",
  "contact",
  "learning",
  "mfa",
  "utils",
]
force-single-line = false

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
