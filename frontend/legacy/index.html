<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Courses — Study with Ayaz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css?v=20261126f" rel="stylesheet">
    <script src="/js/theme.js?v=20261126c"></script>
  </head>
  <body data-page-title="Courses — Study with Ayaz">
    <div id="app-shell"></div>
    <main class="page">
      <section class="hero">
        <div class="reveal">
          <div class="hero-kicker">Study desk</div>
          <h1>Learn to ship code and freelance work</h1>
          <p class="hero-lead">
            Practical courses in programming, freelancing, and digital craft—
            taught for people who want skills they can use this week
          </p>
          <div class="hero-cta">
            <a class="btn btn-swa btn-lg" href="#catalog">Browse courses</a>
            <a class="btn btn-ghost btn-lg" href="/become-pro.html">See Pro access</a>
          </div>
        </div>
        <div class="hero-desk reveal" id="hero-desk" aria-label="3D study desk"></div>
      </section>

      <section id="catalog">
        <div class="section-head reveal">
          <div>
            <h2>Course catalog</h2>
          </div>
          <p>Search and open a playlist</p>
        </div>
        <form id="catalog-search" class="catalog-tools reveal" role="search">
          <input class="form-control" name="search" placeholder="Search courses" aria-label="Search courses">
          <button class="btn btn-ghost" type="submit" aria-label="Search">
            <span data-icon="search"></span>
          </button>
        </form>
        <div id="alert-box"></div>
        <div id="courses-grid" class="courses-grid"></div>
        <nav aria-label="Course pagination">
          <ul id="pagination" class="pagination justify-content-center"></ul>
        </nav>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js?v=20261126c"></script>
    <script src="/js/api.js?v=20261126f"></script>
    <script src="/js/icons.js?v=20261126c"></script>
    <script src="/js/text.js?v=20261126c"></script>
    <script src="/js/layout.js?v=20261126f"></script>
    <script src="/js/nav.js?v=20261126c"></script>
    <script src="/js/motion.js?v=20261126c"></script>
    <script>
      document.querySelectorAll('[data-icon]').forEach(function (el) {
        el.outerHTML = Icons.svg(el.getAttribute('data-icon'));
      });

      function renderCourses(payload) {
        const grid = document.getElementById('courses-grid');
        const results = payload.results || [];
        if (!results.length) {
          grid.innerHTML =
            '<div class="empty-state"><p>No courses match that search</p></div>';
          return;
        }
        grid.innerHTML = results.map(function (course) {
          const badge = course.is_premium
            ? '<span class="status-pill is-pro">Pro</span>'
            : '<span class="status-pill is-free">Free</span>';
          const desc = TextUtil.stripHtml(course.courses_description).slice(0, 90);
          const img = course.course_image || course.thumbnail_url ||
            'https://placehold.co/640x360/2a241e/f7f4ee?text=Course';
          return (
            '<a class="course-card reveal" href="/course-details.html?slug=' +
              encodeURIComponent(course.slug) + '">' +
              '<div class="course-card-media">' +
                '<img src="' + img + '" alt="">' +
              '</div>' +
              '<div class="course-card-body">' +
                '<div class="course-card-meta">' + badge + '</div>' +
                '<h3 class="course-title">' + TextUtil.stripEmoji(course.courses_name) + '</h3>' +
                '<p>' + desc + '</p>' +
                '<span class="card-cta">Open course</span>' +
              '</div>' +
            '</a>'
          );
        }).join('');
        if (window.Motion) Motion.initReveal();
      }

      function renderPagination(payload) {
        const ul = document.getElementById('pagination');
        const pageSize = 8;
        const count = payload.count || 0;
        const totalPages = Math.max(1, Math.ceil(count / pageSize));
        const params = new URLSearchParams(window.location.search);
        const current = parseInt(params.get('page') || '1', 10);
        if (totalPages <= 1) {
          ul.innerHTML = '';
          return;
        }
        function pageLink(page, label, disabled, active) {
          const next = new URLSearchParams(params);
          next.set('page', String(page));
          const cls = 'page-item' +
            (disabled ? ' disabled' : '') +
            (active ? ' active' : '');
          return (
            '<li class="' + cls + '">' +
              '<a class="page-link" href="/index.html?' + next.toString() + '#catalog">' +
                label +
              '</a>' +
            '</li>'
          );
        }
        let html = '';
        html += pageLink(Math.max(1, current - 1), 'Prev', current <= 1, false);
        for (let i = 1; i <= totalPages; i += 1) {
          html += pageLink(i, String(i), false, i === current);
        }
        html += pageLink(
          Math.min(totalPages, current + 1),
          'Next',
          current >= totalPages,
          false
        );
        ul.innerHTML = html;
      }

      async function load() {
        const params = new URLSearchParams(window.location.search);
        const query = {};
        if (params.get('page')) query.page = params.get('page');
        if (params.get('search')) query.search = params.get('search');
        const searchInput = document.querySelector('#catalog-search input[name="search"]');
        if (searchInput && params.get('search')) {
          searchInput.value = params.get('search');
        }
        try {
          const data = await API.getCourses(query);
          renderCourses(data);
          renderPagination(data);
        } catch (err) {
          document.getElementById('alert-box').innerHTML =
            '<div class="alert alert-danger">' + API.formatError(err) + '</div>';
        }
      }

      document.getElementById('catalog-search').addEventListener('submit', function (event) {
        event.preventDefault();
        const value = (event.target.search.value || '').trim();
        const url = new URL('/index.html', window.location.origin);
        if (value) url.searchParams.set('search', value);
        url.hash = 'catalog';
        window.location.href = url.toString();
      });

      document.addEventListener('DOMContentLoaded', load);

      function canUseWebGL() {
        try {
          const canvas = document.createElement('canvas');
          return !!(
            canvas.getContext('webgl') ||
            canvas.getContext('experimental-webgl')
          );
        } catch (err) {
          return false;
        }
      }

      // Lazy-load the 3D desk after the headline paints.
      window.addEventListener('load', function () {
        const mount = document.getElementById('hero-desk');
        if (!mount) return;
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const narrow = window.matchMedia('(max-width: 767px)').matches;
        if (reduced || narrow || !canUseWebGL()) {
          mount.innerHTML =
            '<div class="hero-desk-fallback">Open notebook beside a terminal</div>';
          return;
        }
        const s = document.createElement('script');
        s.type = 'module';
        s.src = '/js/hero-desk.js?v=20261126e';
        document.body.appendChild(s);
      });
    </script>
  </body>
</html>
