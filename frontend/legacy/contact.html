<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — Study with Ayaz</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css?v=20261126f" rel="stylesheet">
    <script src="/js/theme.js?v=20261126c"></script>
  </head>
  <body data-page-title="Contact — Study with Ayaz">
    <div id="app-shell"></div>
    <main class="page-narrow">
      <div class="auth-panel reveal">
        <h1 class="lesson-rule">Contact</h1>
        <p class="lead">Questions about a course or Pro? Send a short note.</p>
        <div id="alert-box"></div>
        <form id="contact-form" class="stack">
          <div>
            <label class="form-label" for="name">Name</label>
            <input id="name" type="text" name="name" required class="form-control"
              placeholder="Name">
          </div>
          <div>
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" name="email" required class="form-control"
              placeholder="Email">
          </div>
          <div>
            <label class="form-label" for="message">Message</label>
            <textarea id="message" name="message" required class="form-control"
              placeholder="Message" style="min-height: 120px;"></textarea>
          </div>
          <div id="turnstile-slot"></div>
          <button class="btn btn-swa" type="submit">Send message</button>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js?v=20261126c"></script>
    <script src="/js/api.js?v=20261126f"></script>
    <script src="/js/icons.js?v=20261126c"></script>
    <script src="/js/text.js?v=20261126c"></script>
    <script src="/js/layout.js?v=20261126f"></script>
    <script src="/js/nav.js?v=20261126c"></script>
    <script src="/js/motion.js?v=20261126c"></script>
    <script>
      const alertBox = document.getElementById('alert-box');
      let turnstile = { enabled: false, get: function () { return ''; }, reset: function () {} };

      document.getElementById('contact-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.target;
        const token = turnstile.get();
        if (turnstile.enabled && !token) {
          alertBox.innerHTML =
            '<div class="alert alert-warning">Complete the security check</div>';
          return;
        }
        const payload = {
          name: form.name.value,
          email: form.email.value,
          message: form.message.value,
        };
        if (token) {
          payload.turnstile_token = token;
        }
        try {
          await API.contact(payload);
          form.reset();
          turnstile.reset();
          alertBox.innerHTML =
            '<div class="alert alert-success">Message sent</div>';
        } catch (err) {
          turnstile.reset();
          alertBox.innerHTML =
            '<div class="alert alert-warning">' + API.formatError(err) + '</div>';
        }
      });

      window.addEventListener('load', async function () {
        try {
          turnstile = await API.mountTurnstile('turnstile-slot');
        } catch (err) {
          turnstile = { enabled: false, get: function () { return ''; }, reset: function () {} };
        }
      });
    </script>
  </body>
</html>
