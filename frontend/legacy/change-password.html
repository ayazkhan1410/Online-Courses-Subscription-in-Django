<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New password — Study with Ayaz</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css?v=20261126f" rel="stylesheet">
    <script src="/js/theme.js?v=20261126c"></script>
  </head>
  <body data-page-title="New password — Study with Ayaz">
    <div id="app-shell"></div>
    <main class="page-narrow">
      <div class="auth-panel reveal">
        <h1 class="lesson-rule">New password</h1>
        <p class="lead">Choose a password you will remember for this account.</p>
        <div id="alert-box"></div>
        <form id="change-form" class="stack">
          <div>
            <label class="form-label" for="password">New password</label>
            <input id="password" type="password" name="password" required minlength="4"
              class="form-control" placeholder="New password">
          </div>
          <div>
            <label class="form-label" for="confirm_password">Confirm password</label>
            <input id="confirm_password" type="password" name="confirm_password"
              required minlength="4" class="form-control" placeholder="Confirm password">
          </div>
          <button class="btn btn-swa" type="submit">Update password</button>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js?v=20261126c"></script>
    <script src="/js/api.js?v=20261126f"></script>
    <script src="/js/icons.js?v=20261126c"></script>
    <script src="/js/text.js?v=20261126c"></script>
    <script src="/js/layout.js?v=20261126f"></script>
    <script src="/js/nav.js?v=20261126c"></script>
    <script src="/js/motion.js?v=20261126c"></script>
    <script>
      document.getElementById('change-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.target;
        const alertBox = document.getElementById('alert-box');
        const token = Nav.qs('token');
        if (!token) {
          alertBox.innerHTML =
            '<div class="alert alert-danger">Missing recovery token.</div>';
          return;
        }
        try {
          const data = await API.changePassword({
            token: token,
            password: form.password.value,
            confirm_password: form.confirm_password.value,
          });
          alertBox.innerHTML =
            '<div class="alert alert-success">' +
            (data.message || 'Password changed successfully') +
            '</div>';
          setTimeout(function () {
            window.location.href = '/login.html';
          }, 800);
        } catch (err) {
          alertBox.innerHTML =
            '<div class="alert alert-warning">' + API.formatError(err) + '</div>';
        }
      });
    </script>
  </body>
</html>
