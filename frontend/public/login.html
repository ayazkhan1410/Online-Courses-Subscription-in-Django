<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Here!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body data-page-title="Login Here!">
    <div id="app-shell"></div>
    <section class="gradient-custom">
      <div class="container mt-3">
        <div class="row d-flex justify-content-center align-items-center">
          <div class="col-12 col-md-8 col-lg-6 col-xl-5 shadow-lg p-3 mb-5 bg-body-tertiary rounded">
            <div class="card bg-dark text-white auth-card">
              <div class="card-body p-5 text-center">
                <div id="alert-box"></div>
                <h2 class="fw-bold mb-2 text-uppercase">Login</h2>
                <p class="text-white-50 mb-5">Please enter your login and password!</p>
                <form id="login-form">
                  <div class="form-outline form-white mb-4">
                    <input type="email" name="email" required placeholder="Email"
                      class="form-control form-control-lg">
                  </div>
                  <div class="form-outline form-white mb-4">
                    <input type="password" name="password" required placeholder="Password"
                      class="form-control form-control-lg">
                  </div>
                  <button class="btn btn-outline-light btn-lg px-5" type="submit">Login</button>
                </form>
                <p class="mb-0 mt-3">Don't have an account?
                  <a href="/register.html" class="text-white-50 fw-bold">Sign Up</a>
                </p>
                <a class="text-white-50" href="/forget-password.html">Forgot password?</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/nav.js"></script>
    <script>
      document.getElementById('login-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.target;
        const alertBox = document.getElementById('alert-box');
        try {
          const data = await API.login({
            email: form.email.value,
            password: form.password.value,
          });
          API.setSession(data.token, data.user);
          const next = Nav.qs('next') || '/index.html';
          window.location.href = next;
        } catch (err) {
          alertBox.innerHTML =
            '<div class="alert alert-warning">' + API.formatError(err) + '</div>';
        }
      });
    </script>
  </body>
</html>
