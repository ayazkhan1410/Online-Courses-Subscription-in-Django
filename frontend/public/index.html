<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body data-page-title="Home Page">
    <div id="app-shell"></div>
    <div class="container mt-4">
      <div id="alert-box"></div>
      <div id="courses-grid" class="row justify-content-center"></div>
      <nav aria-label="Course pagination" class="mt-3">
        <ul id="pagination" class="pagination justify-content-center"></ul>
      </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/nav.js"></script>
    <script>
      function stripHtml(html) {
        const div = document.createElement('div');
        div.innerHTML = html || '';
        return (div.textContent || div.innerText || '').trim();
      }

      function renderCourses(payload) {
        const grid = document.getElementById('courses-grid');
        const results = payload.results || [];
        if (!results.length) {
          grid.innerHTML =
            '<div class="col-12 text-center py-5"><p>No courses found.</p></div>';
          return;
        }
        grid.innerHTML = results.map(function (course) {
          const badge = course.is_premium
            ? '<span class="badge text-bg-secondary">Premium</span>'
            : '<span class="badge text-bg-success">Free</span>';
          const desc = stripHtml(course.courses_description).slice(0, 68);
          const img = course.course_image ||
            'https://placehold.co/400x240?text=Course';
          return (
            '<div class="col-md-3">' +
              '<div class="card shadow p-3 mb-5 bg-body-tertiary rounded course-card">' +
                '<img src="' + img + '" class="card-img-top" alt="">' +
                '<div class="card-body">' +
                  '<h5 class="card-title">' + course.courses_name + '</h5>' +
                  badge +
                  '<p class="card-text mt-2">' + desc + '</p>' +
                  '<a href="/course-details.html?slug=' +
                    encodeURIComponent(course.slug) +
                    '" class="btn btn-primary">View Details</a>' +
                '</div>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      }

      function renderPagination(payload) {
        const ul = document.getElementById('pagination');
        const pageSize = 8;
        const count = payload.count || 0;
        const totalPages = Math.max(1, Math.ceil(count / pageSize));
        const params = new URLSearchParams(window.location.search);
        const current = parseInt(params.get('page') || '1', 10);
        if (totalPages <= 1) {
          ul.innerHTML = '';
          return;
        }
        function pageLink(page, label, disabled, active) {
          const next = new URLSearchParams(params);
          next.set('page', String(page));
          const cls = 'page-item' +
            (disabled ? ' disabled' : '') +
            (active ? ' active' : '');
          return (
            '<li class="' + cls + '">' +
              '<a class="page-link" href="/index.html?' + next.toString() + '">' +
                label +
              '</a>' +
            '</li>'
          );
        }
        let html = '';
        html += pageLink(1, '&laquo;&laquo;', current <= 1, false);
        html += pageLink(Math.max(1, current - 1), '&laquo;', current <= 1, false);
        for (let i = 1; i <= totalPages; i += 1) {
          html += pageLink(i, String(i), false, i === current);
        }
        html += pageLink(
          Math.min(totalPages, current + 1),
          '&raquo;',
          current >= totalPages,
          false
        );
        html += pageLink(totalPages, '&raquo;&raquo;', current >= totalPages, false);
        ul.innerHTML = html;
      }

      async function load() {
        const params = new URLSearchParams(window.location.search);
        const query = {};
        if (params.get('page')) {
          query.page = params.get('page');
        }
        if (params.get('search')) {
          query.search = params.get('search');
        }
        try {
          const data = await API.getCourses(query);
          renderCourses(data);
          renderPagination(data);
        } catch (err) {
          document.getElementById('alert-box').innerHTML =
            '<div class="alert alert-danger">' + API.formatError(err) + '</div>';
        }
      }

      document.addEventListener('DOMContentLoaded', load);
    </script>
  </body>
</html>
