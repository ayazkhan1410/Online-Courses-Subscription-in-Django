<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Become-Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
  </head>
  <body data-page-title="Become-Pro">
    <div id="app-shell"></div>
    <div class="container mt-5">
      <div id="alert-box"></div>
      <div class="row">
        <div class="col-lg-6">
          <h3>Why become Pro?</h3>
          <p>
            Unlock your full potential by upgrading to a Pro membership! Gain exclusive access
            to our extensive library of courses in programming, technology, graphic design,
            and freelancing.
          </p>
          <form id="payment-form">
            <div class="mb-3">
              <label class="form-label">Membership Type</label>
              <select class="form-control" name="membership" id="membership" required>
                <option value="">Choose</option>
              </select>
            </div>
            <label for="card-element">Credit or debit card</label>
            <div id="card-element" class="mb-2"></div>
            <div id="card-errors" role="alert" class="text-danger mb-2"></div>
            <button class="btn btn-primary mt-3" type="submit">Submit Payment</button>
          </form>
        </div>
        <div class="col-lg-4 mt-4 mx-4">
          <img
            class="img-fluid rounded"
            src="https://media.onlinefreecourse.net/udemy/2018/09/26004647/vjJ96S.jpg"
            alt="Become Pro"
          >
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/nav.js"></script>
    <script>
      let card = null;
      let stripe = null;

      async function init() {
        if (!API.getToken()) {
          window.location.href =
            '/login.html?next=' + encodeURIComponent('/become-pro.html');
          return;
        }
        const user = API.getUser();
        if (user && user.is_pro) {
          window.location.href = '/already-pro.html';
          return;
        }

        const alertBox = document.getElementById('alert-box');
        try {
          const [subs, config] = await Promise.all([
            API.getSubscriptions(),
            API.getConfig(),
          ]);
          const select = document.getElementById('membership');
          (subs || []).forEach(function (item) {
            const option = document.createElement('option');
            option.value = item.id;
            option.textContent =
              item.subscription_list + ' - ' + item.subscription_price + '₹';
            select.appendChild(option);
          });

          if (!config.stripe_publishable_key) {
            alertBox.innerHTML =
              '<div class="alert alert-warning">Stripe publishable key is not configured.</div>';
            return;
          }
          stripe = Stripe(config.stripe_publishable_key);
          const elements = stripe.elements();
          card = elements.create('card');
          card.mount('#card-element');
          card.on('change', function (event) {
            document.getElementById('card-errors').textContent =
              event.error ? event.error.message : '';
          });
        } catch (err) {
          if (err.status === 401 || err.status === 403) {
            window.location.href =
              '/login.html?next=' + encodeURIComponent('/become-pro.html');
            return;
          }
          alertBox.innerHTML =
            '<div class="alert alert-danger">' + API.formatError(err) + '</div>';
        }
      }

      document.getElementById('payment-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const alertBox = document.getElementById('alert-box');
        const membership = document.getElementById('membership').value;
        if (!membership) {
          alertBox.innerHTML =
            '<div class="alert alert-warning">Please choose a membership.</div>';
          return;
        }
        if (!stripe || !card) {
          alertBox.innerHTML =
            '<div class="alert alert-warning">Stripe is not ready.</div>';
          return;
        }
        const result = await stripe.createToken(card);
        if (result.error) {
          document.getElementById('card-errors').textContent = result.error.message;
          return;
        }
        try {
          await API.becomePro({
            membership: parseInt(membership, 10),
            stripe_token: result.token.id,
          });
          const user = API.getUser() || {};
          user.is_pro = true;
          API.setSession(API.getToken(), user);
          window.location.href = '/success.html';
        } catch (err) {
          alertBox.innerHTML =
            '<div class="alert alert-warning">' + API.formatError(err) + '</div>';
        }
      });

      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
