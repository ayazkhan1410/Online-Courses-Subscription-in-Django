<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join — Study with Ayaz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css?v=20261126b" rel="stylesheet">
    <script src="/js/theme.js?v=20261126b"></script>
  </head>
  <body data-page-title="Join — Study with Ayaz">
    <div id="app-shell"></div>
    <main class="page-narrow">
      <div class="auth-panel reveal">
        <h1 class="lesson-rule">Create account</h1>
        <p class="lead">Start free courses, upgrade to Pro when you need more.</p>
        <div id="alert-box"></div>
        <form id="register-form" class="stack">
          <div>
            <label class="form-label" for="username">Username</label>
            <input id="username" type="text" name="username" required class="form-control"
              placeholder="Username" autocomplete="username">
          </div>
          <div>
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" name="email" required class="form-control"
              placeholder="Email" autocomplete="email">
          </div>
          <div>
            <label class="form-label" for="password">Password</label>
            <input id="password" type="password" name="password" required class="form-control"
              placeholder="Password" autocomplete="new-password">
          </div>
          <button class="btn btn-swa" type="submit">Join</button>
        </form>
        <div class="auth-links">
          Already have an account? <a href="/login.html">Log in</a>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js?v=20261126b"></script>
    <script src="/js/api.js?v=20261126b"></script>
    <script src="/js/layout.js?v=20261126b"></script>
    <script src="/js/nav.js?v=20261126b"></script>
    <script src="/js/motion.js?v=20261126b"></script>
    <script>
      document.getElementById('register-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.target;
        const alertBox = document.getElementById('alert-box');
        try {
          const data = await API.register({
            username: form.username.value,
            email: form.email.value,
            password: form.password.value,
          });
          API.setSession(data.token, data.user);
          alertBox.innerHTML =
            '<div class="alert alert-success">Account created</div>';
          setTimeout(function () {
            window.location.href = '/dashboard.html';
          }, 600);
        } catch (err) {
          alertBox.innerHTML =
            '<div class="alert alert-warning">' + API.formatError(err) + '</div>';
        }
      });
    </script>
  </body>
</html>
