<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course — Study with Ayaz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css?v=20261126c" rel="stylesheet">
    <script src="/js/theme.js?v=20261126c"></script>
  </head>
  <body data-page-title="Course — Study with Ayaz">
    <div id="app-shell"></div>
    <main class="page">
      <div id="alert-box"></div>
      <div id="course-content">
        <div class="empty-state">Loading course</div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js?v=20261126c"></script>
    <script src="/js/api.js?v=20261126c"></script>
    <script src="/js/icons.js?v=20261126c"></script>
    <script src="/js/text.js?v=20261126c"></script>
    <script src="/js/layout.js?v=20261126c"></script>
    <script src="/js/nav.js?v=20261126c"></script>
    <script src="/js/motion.js?v=20261126c"></script>
    <script>
      let courseState = null;
      let activeIndex = 0;

      function embedSrc(mod) {
        if (!mod) return '';
        return mod.embed_url || mod.module_video || '';
      }

      function renderPlayer(mod, enrolled, total) {
        if (!mod) {
          return (
            '<div class="player-shell">' +
              '<div class="player-bezel"><span></span><span></span><span></span>' +
              '<em>lesson player</em></div>' +
              '<div class="video-container"><div class="empty-player">' +
                '<p>No lessons in this course yet</p>' +
              '</div></div>' +
            '</div>'
          );
        }
        if (!enrolled) {
          return (
            '<div class="player-shell reveal">' +
              '<div class="player-bezel">' +
                '<span></span><span></span><span></span>' +
                '<em>enroll to watch</em>' +
              '</div>' +
              '<div class="video-container"><div class="empty-player">' +
                '<p>Enroll to watch lessons from this playlist</p>' +
              '</div></div>' +
            '</div>'
          );
        }
        const src = embedSrc(mod);
        const day = TextUtil.dayLabel(activeIndex, total);
        return (
          '<div class="player-shell reveal">' +
            '<div class="player-bezel">' +
              '<span></span><span></span><span></span>' +
              '<em class="lesson-day">' + day + '</em>' +
            '</div>' +
            '<div class="video-container">' +
              (src
                ? '<iframe src="' + src +
                  '" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" title="' +
                  TextUtil.stripEmoji(mod.module_name || 'Lesson') + '"></iframe>'
                : '<div class="empty-player"><p>Video unavailable</p></div>') +
            '</div>' +
          '</div>' +
          '<div class="module-desc reveal">' +
            '<div class="module-desc-row">' +
              '<div>' +
                '<div class="lesson-day">' + day + '</div>' +
                '<h3>' + TextUtil.stripEmoji(mod.module_name) + '</h3>' +
              '</div>' +
              '<button type="button" class="btn btn-ghost" id="mark-complete">' +
                (mod.is_completed
                  ? Icons.svg('check') + ' Completed'
                  : 'Mark complete') +
              '</button>' +
            '</div>' +
            '<div class="rich">' + TextUtil.stripEmoji(mod.module_description || '') + '</div>' +
          '</div>'
        );
      }

      function renderToolbar(course) {
        const enrolled = !!course.is_enrolled;
        const wish = !!course.is_wishlisted;
        const pct = course.progress_percent || 0;
        const modules = course.course_modules || [];
        let primary = '';
        if (!API.getToken()) {
          primary =
            '<a class="btn btn-swa" href="/login.html?next=' +
            encodeURIComponent(window.location.pathname + window.location.search) +
            '">Log in to enroll</a>';
        } else if (!enrolled) {
          primary = course.is_premium
            ? '<button type="button" class="btn btn-accent" id="btn-enroll">Enroll</button>'
            : '<button type="button" class="btn btn-swa" id="btn-enroll">Enroll free</button>';
        } else {
          primary =
            '<span class="status-pill is-enrolled">Enrolled</span>' +
            '<span class="lesson-day">' +
              TextUtil.dayLabel(activeIndex, modules.length) +
            '</span>' +
            '<span class="progress-meta tabular">' + pct + '% complete</span>';
        }
        return (
          '<div class="course-toolbar reveal">' +
            '<div class="course-toolbar-meta">' +
              (course.is_premium
                ? '<span class="status-pill is-pro">Pro</span>'
                : '<span class="status-pill is-free">Free</span>') +
              '<span class="muted tabular">' +
                (course.module_count || modules.length) +
                ' lessons</span>' +
            '</div>' +
            '<div class="course-toolbar-actions">' +
              primary +
              '<button type="button" class="btn btn-ghost" id="btn-wish">' +
                Icons.svg('bookmark') +
                (wish ? ' Saved' : ' Save') +
              '</button>' +
            '</div>' +
            (enrolled
              ? '<div class="progress-track course-progress">' +
                  '<div class="progress-fill" style="width:' + pct + '%"></div>' +
                '</div>'
              : '') +
          '</div>'
        );
      }

      function renderPage() {
        const course = courseState;
        if (!course) return;
        const modules = course.course_modules || [];
        const enrolled = !!course.is_enrolled;
        const active = modules[activeIndex] || modules[0];
        const list = modules.map(function (mod, index) {
          let cls = 'module-item';
          if (index === activeIndex) cls += ' is-active';
          if (mod.is_completed) cls += ' is-done';
          if (!enrolled) cls += ' is-locked';
          return (
            '<button type="button" class="' + cls + '" data-index="' + index + '"' +
              (enrolled ? '' : ' disabled') + '>' +
              '<div class="idx">' + TextUtil.dayLabel(index, modules.length) + '</div>' +
              '<div class="name">' + TextUtil.stripEmoji(mod.module_name) + '</div>' +
            '</button>'
          );
        }).join('');

        const thumb = course.course_image || course.thumbnail_url || '';
        document.getElementById('course-content').innerHTML =
          '<div class="learn-layout">' +
            '<div>' +
              '<div class="learn-copy reveal">' +
                (thumb
                  ? '<div class="course-hero-thumb"><img src="' + thumb + '" alt=""></div>'
                  : '') +
                '<h1 class="course-title">' +
                  TextUtil.stripEmoji(course.courses_name) +
                '</h1>' +
                renderToolbar(course) +
                '<div class="rich">' +
                  TextUtil.stripEmoji(
                    TextUtil.stripHtml(course.courses_description || '')
                  ) +
                '</div>' +
              '</div>' +
              '<div id="player-area" class="mt-4">' +
                renderPlayer(active, enrolled, modules.length) +
              '</div>' +
            '</div>' +
            '<aside class="module-panel reveal">' +
              '<div class="module-panel-head">' +
                '<h2>Lessons</h2>' +
                '<p class="tabular">' + modules.length + ' in playlist</p>' +
              '</div>' +
              '<div id="module-list">' +
                (list || '<p class="p-3 text-muted">No lessons yet</p>') +
              '</div>' +
            '</aside>' +
          '</div>';

        bindInteractions();
        if (window.Motion) Motion.initReveal();
      }

      function bindInteractions() {
        document.querySelectorAll('.module-item:not([disabled])').forEach(function (btn) {
          btn.addEventListener('click', function () {
            activeIndex = parseInt(btn.getAttribute('data-index'), 10) || 0;
            renderPage();
          });
        });

        const enrollBtn = document.getElementById('btn-enroll');
        if (enrollBtn) {
          enrollBtn.addEventListener('click', async function () {
            if (!API.getToken()) {
              window.location.href =
                '/login.html?next=' +
                encodeURIComponent(window.location.pathname + window.location.search);
              return;
            }
            enrollBtn.disabled = true;
            try {
              await API.enrollCourse(courseState.slug);
              await refreshCourse();
            } catch (err) {
              document.getElementById('alert-box').innerHTML =
                '<div class="alert alert-warning">' + API.formatError(err) + '</div>';
              enrollBtn.disabled = false;
            }
          });
        }

        const wishBtn = document.getElementById('btn-wish');
        if (wishBtn) {
          wishBtn.addEventListener('click', async function () {
            if (!API.getToken()) {
              window.location.href =
                '/login.html?next=' +
                encodeURIComponent(window.location.pathname + window.location.search);
              return;
            }
            wishBtn.disabled = true;
            try {
              if (courseState.is_wishlisted) {
                await API.removeWishlist(courseState.slug);
                courseState.is_wishlisted = false;
              } else {
                await API.addWishlist(courseState.slug);
                courseState.is_wishlisted = true;
              }
              renderPage();
            } catch (err) {
              document.getElementById('alert-box').innerHTML =
                '<div class="alert alert-warning">' + API.formatError(err) + '</div>';
              wishBtn.disabled = false;
            }
          });
        }

        const markBtn = document.getElementById('mark-complete');
        if (markBtn) {
          markBtn.addEventListener('click', async function () {
            const mod = (courseState.course_modules || [])[activeIndex];
            if (!mod) return;
            markBtn.disabled = true;
            try {
              await API.markLessonProgress(mod.id, true);
              mod.is_completed = true;
              const modules = courseState.course_modules || [];
              const done = modules.filter(function (m) { return m.is_completed; }).length;
              courseState.progress_percent = modules.length
                ? Math.round(100 * done / modules.length)
                : 0;
              renderPage();
            } catch (err) {
              document.getElementById('alert-box').innerHTML =
                '<div class="alert alert-warning">' + API.formatError(err) + '</div>';
              markBtn.disabled = false;
            }
          });
        }
      }

      async function refreshCourse() {
        const slug = Nav.qs('slug');
        courseState = await API.getCourse(slug);
        document.title =
          TextUtil.stripEmoji(courseState.courses_name) + ' — Study with Ayaz';
        document.body.dataset.pageTitle = document.title;
        renderPage();
      }

      async function load() {
        const slug = Nav.qs('slug');
        if (!slug) {
          document.getElementById('alert-box').innerHTML =
            '<div class="alert alert-warning">Missing course slug</div>';
          document.getElementById('course-content').innerHTML = '';
          return;
        }
        try {
          await refreshCourse();
        } catch (err) {
          document.getElementById('course-content').innerHTML = '';
          document.getElementById('alert-box').innerHTML =
            '<div class="alert alert-danger">' + API.formatError(err) + '</div>';
        }
      }

      document.addEventListener('DOMContentLoaded', load);
    </script>
  </body>
</html>
