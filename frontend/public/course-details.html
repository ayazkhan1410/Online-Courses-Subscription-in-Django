<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body data-page-title="Course Details">
    <div id="app-shell"></div>
    <div class="container mt-3">
      <div id="alert-box"></div>
      <div id="course-content"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/nav.js"></script>
    <script>
      async function load() {
        const slug = Nav.qs('slug');
        if (!slug) {
          document.getElementById('alert-box').innerHTML =
            '<div class="alert alert-warning">Missing course slug.</div>';
          return;
        }
        if (!API.getToken()) {
          window.location.href =
            '/login.html?next=' +
            encodeURIComponent('/course-details.html?slug=' + slug);
          return;
        }
        try {
          const course = await API.getCourse(slug);
          document.title = course.courses_name;
          const modules = course.course_modules || [];
          const videos = modules.map(function (mod) {
            return (
              '<div class="col-md-8 mb-3">' +
                '<h5>' + mod.module_name + '</h5>' +
                '<div class="video-container">' +
                  '<iframe src="' + mod.module_video +
                    '" frameborder="0" allowfullscreen></iframe>' +
                '</div>' +
                '<div>' + (mod.module_description || '') + '</div>' +
              '</div>'
            );
          }).join('');
          const accordion = modules.map(function (mod, index) {
            const n = index + 1;
            return (
              '<div class="card mb-2">' +
                '<div class="card-header">' +
                  '<strong>Module ' + n + ': ' + mod.module_name + '</strong>' +
                '</div>' +
                '<div class="card-body">' + (mod.module_description || '') + '</div>' +
              '</div>'
            );
          }).join('');
          document.getElementById('course-content').innerHTML =
            '<h1>' + course.courses_name + '</h1>' +
            '<div class="mb-3">' + (course.courses_description || '') + '</div>' +
            '<div class="row">' +
              '<div class="col-md-8">' + (videos || '<p>No modules yet.</p>') + '</div>' +
              '<div class="col-md-4"><h4>Course Modules</h4>' + accordion + '</div>' +
            '</div>';
        } catch (err) {
          if (err.status === 401 || err.status === 403) {
            window.location.href =
              '/login.html?next=' +
              encodeURIComponent(window.location.pathname + window.location.search);
            return;
          }
          document.getElementById('alert-box').innerHTML =
            '<div class="alert alert-danger">' + API.formatError(err) + '</div>';
        }
      }
      document.addEventListener('DOMContentLoaded', load);
    </script>
  </body>
</html>
