<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body data-page-title="Change Password">
    <div id="app-shell"></div>
    <div class="container mt-5" style="max-width: 480px;">
      <div id="alert-box"></div>
      <div class="card shadow p-4">
        <h2 class="mb-3">Change Password</h2>
        <form id="change-form">
          <div class="mb-3">
            <input type="password" name="password" required minlength="4"
              class="form-control" placeholder="New password">
          </div>
          <div class="mb-3">
            <input type="password" name="confirm_password" required minlength="4"
              class="form-control" placeholder="Confirm password">
          </div>
          <button class="btn btn-primary" type="submit">Update password</button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/nav.js"></script>
    <script>
      document.getElementById('change-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.target;
        const alertBox = document.getElementById('alert-box');
        const token = Nav.qs('token');
        if (!token) {
          alertBox.innerHTML =
            '<div class="alert alert-danger">Missing recovery token.</div>';
          return;
        }
        try {
          const data = await API.changePassword({
            token: token,
            password: form.password.value,
            confirm_password: form.confirm_password.value,
          });
          alertBox.innerHTML =
            '<div class="alert alert-success">' +
            (data.message || 'Password changed successfully') +
            '</div>';
          setTimeout(function () {
            window.location.href = '/login.html';
          }, 800);
        } catch (err) {
          alertBox.innerHTML =
            '<div class="alert alert-warning">' + API.formatError(err) + '</div>';
        }
      });
    </script>
  </body>
</html>
