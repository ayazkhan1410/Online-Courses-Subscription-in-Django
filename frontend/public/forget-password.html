<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forget Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body data-page-title="Forget Password">
    <div id="app-shell"></div>
    <div class="container mt-5" style="max-width: 480px;">
      <div id="alert-box"></div>
      <div class="card shadow p-4">
        <h2 class="mb-3">Forget Password</h2>
        <form id="forget-form">
          <div class="mb-3">
            <input type="email" name="email" required class="form-control"
              placeholder="Enter your email">
          </div>
          <button class="btn btn-primary" type="submit">Send recovery email</button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/nav.js"></script>
    <script>
      document.getElementById('forget-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.target;
        const alertBox = document.getElementById('alert-box');
        try {
          const data = await API.forgetPassword({ email: form.email.value });
          alertBox.innerHTML =
            '<div class="alert alert-success">' +
            (data.message || 'An email has been sent.') +
            '</div>';
        } catch (err) {
          alertBox.innerHTML =
            '<div class="alert alert-warning">' + API.formatError(err) + '</div>';
        }
      });
    </script>
  </body>
</html>
