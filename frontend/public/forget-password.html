<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password — Study with Ayaz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css?v=20261126b" rel="stylesheet">
    <script src="/js/theme.js?v=20261126b"></script>
  </head>
  <body data-page-title="Reset password — Study with Ayaz">
    <div id="app-shell"></div>
    <main class="page-narrow">
      <div class="auth-panel reveal">
        <h1 class="lesson-rule">Reset password</h1>
        <p class="lead">We will email a recovery link if the account exists.</p>
        <div id="alert-box"></div>
        <form id="forget-form" class="stack">
          <div>
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" name="email" required class="form-control"
              placeholder="Email">
          </div>
          <button class="btn btn-swa" type="submit">Send recovery email</button>
        </form>
        <div class="auth-links">
          <a href="/login.html">Back to log in</a>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js?v=20261126b"></script>
    <script src="/js/api.js?v=20261126b"></script>
    <script src="/js/layout.js?v=20261126b"></script>
    <script src="/js/nav.js?v=20261126b"></script>
    <script src="/js/motion.js?v=20261126b"></script>
    <script>
      document.getElementById('forget-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const form = event.target;
        const alertBox = document.getElementById('alert-box');
        try {
          const data = await API.forgetPassword({ email: form.email.value });
          alertBox.innerHTML =
            '<div class="alert alert-success">' +
            (data.message || 'An email has been sent.') +
            '</div>';
        } catch (err) {
          alertBox.innerHTML =
            '<div class="alert alert-warning">' + API.formatError(err) + '</div>';
        }
      });
    </script>
  </body>
</html>
