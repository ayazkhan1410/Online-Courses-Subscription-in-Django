server {
    listen 4780;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-style fallback not needed; multi-page static site
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
