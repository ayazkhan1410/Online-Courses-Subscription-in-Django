<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 08 · 50 Days of Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  body { min-height: 100vh; }
  .topbar { position: sticky; top: 0; z-index: 10; height: 56px; display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(160px, 320px) auto; gap: 20px; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .topbar .title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .prog { display: flex; align-items: center; gap: 12px; }
  .topbar .prog .ticks { flex: 1; height: 10px; }
  .shell { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: calc(100vh - 56px); }
  .main { padding: 24px 32px 48px; max-width: 1100px; width: 100%; margin: 0 auto; }
  .player { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-md); overflow: hidden; background: #0f0e0c; display: grid; place-items: center; }
  .player-code { position: absolute; inset: 0; padding: 40px 48px; font: 400 15px/26px var(--font-mono); color: #9bbfa5; background: repeating-linear-gradient(to bottom, #18201b 0 25px, #151c18 25px 26px); }
  .player-code .kw { color: #e8a87c; } .player-code .s { color: #d7c58b; } .player-code .c { color: #6c7a70; }
  .play { position: relative; width: 64px; height: 64px; border-radius: 50%; background: rgba(15, 14, 12, .8); border: 1px solid rgba(255,255,255,.18); display: grid; place-items: center; color: #ece6dc; cursor: pointer; }
  .play .i { width: 24px; height: 24px; fill: currentColor; margin-left: 3px; }
  .player-note { position: absolute; left: 16px; bottom: 12px; font: 400 11px/1 var(--font-mono); color: rgba(236,230,220,.5); }
  .l-head { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; padding: 24px 0; border-bottom: 1px solid var(--line); }
  .l-head .meta { margin-bottom: 6px; }
  .l-actions { display: flex; gap: 8px; flex: none; }
  .tabs2 { display: flex; gap: 4px; margin: 24px 0 16px; }
  .tabs2 button { height: 32px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: var(--text-2); font-size: 14px; cursor: pointer; }
  .tabs2 button[aria-selected="true"] { background: var(--sunken); color: var(--text); }
  .notes { width: 100%; min-height: 160px; padding: 16px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font: 400 14px/24px var(--font-mono); resize: vertical;
           background-image: repeating-linear-gradient(to bottom, transparent 0 23px, var(--line) 23px 24px); background-position: 0 15px; }
  .notes-foot { display: flex; justify-content: space-between; margin-top: 8px; }
  .list { border-left: 1px solid var(--line); background: var(--surface); position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
  .list-head { padding: 20px 20px 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .list ol { list-style: none; margin: 0; padding: 0 8px 16px; }
  .list li a { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; padding: 10px 12px; border-radius: var(--r-sm); font-size: 14px; color: var(--text-2); }
  .list li a:hover { background: var(--raised); color: var(--text); }
  .list li .n { display: block; font: 400 11px/1 var(--font-mono); color: var(--text-3); margin-bottom: 4px; }
  .list .mark { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line-strong); margin-top: 2px; display: grid; place-items: center; }
  .list .done .mark { background: var(--text-2); border-color: var(--text-2); color: var(--surface); }
  .list .done .mark .i { width: 10px; height: 10px; stroke-width: 2.5; }
  .list .now a { background: var(--accent-soft); color: var(--text); }
  .list .now .mark { border: 2px solid var(--accent); }
  .list .now .n { color: var(--accent-ink); }
  @media (max-width: 1024px) {
    .shell { grid-template-columns: 1fr; }
    .list { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (max-width: 720px) {
    .topbar { grid-template-columns: auto minmax(0, 1fr) auto auto; padding: 0 12px; gap: 8px; }
    .topbar .prog .ticks { display: none; }
    .main { padding: 0 0 32px; }
    .player { border-radius: 0; }
    .player-code { padding: 20px; font-size: 12px; line-height: 20px; background-size: auto; }
    .l-head, .tabs2, .notes-wrap { padding-inline: 16px; }
    .l-head { flex-direction: column; }
    .l-actions { width: 100%; } .l-actions .btn-primary { flex: 1; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="btn btn-ghost btn-icon" href="course.html" aria-label="Back to course"><span data-icon="chevron-left"></span></a>
  <div class="title">50 Days of Python Programming challenge</div>
  <div class="prog"><span class="counter small"><b>07</b><span>/ 50</span></span><div class="ticks" data-ticks="7/50"></div></div>
  <button class="btn btn-ghost btn-icon theme-toggle" aria-label="Switch theme"><span data-icon="sun" class="i-sun"></span><span data-icon="moon" class="i-moon"></span></button>
</header>

<div class="shell">
  <main class="main">
    <!-- React: youtube-nocookie.com iframe goes here -->
    <div class="player">
      <div class="player-code" aria-hidden="true">
        <div class="c"># Day 08: lists</div>
        <div><span class="kw">fruits</span> = [<span class="s">"apple"</span>, <span class="s">"mango"</span>, <span class="s">"banana"</span>]</div>
        <div><span class="kw">marks</span> = [72, 88, 95]</div>
        <div>&nbsp;</div>
        <div><span class="kw">print</span>(fruits[0])</div>
        <div><span class="kw">print</span>(len(marks))</div>
      </div>
      <button class="play" aria-label="Play lesson"><span data-icon="play"></span></button>
      <span class="player-note">Plays from YouTube</span>
    </div>

    <div class="l-head">
      <div>
        <div class="meta">Day 08 of 50</div>
        <h1 class="h2">How to create a list in Python</h1>
      </div>
      <div class="l-actions">
        <button class="btn btn-icon" aria-label="Previous lesson"><span data-icon="chevron-left"></span></button>
        <button class="btn btn-primary"><span data-icon="check" class="i-16"></span>Mark complete</button>
        <button class="btn btn-icon" aria-label="Next lesson"><span data-icon="chevron-right"></span></button>
      </div>
    </div>

    <div class="tabs2" role="tablist"><button role="tab" aria-selected="true">Notes</button><button role="tab" aria-selected="false">About</button></div>
    <div class="notes-wrap">
      <textarea class="notes" aria-label="Your notes">Lists keep order and can change.
fruits[0] is the first item, fruits[-1] the last.</textarea>
      <div class="notes-foot"><span class="meta">Saved 2 min ago</span><span class="meta">Only you can see your notes</span></div>
    </div>
  </main>

  <aside class="list" aria-label="Lessons">
    <div class="list-head"><h2 class="h3">Lessons</h2><span class="meta">7 done</span></div>
    <ol data-list></ol>
  </aside>
</div>

<script>
  const L = ["Basic introduction and setup", "How the Python interpreter works", "Variables in Python", "Python comments", "Taking user input", "Typecasting in Python", "Types of typecasting", "How to create a list", "List methods", "Strings in Python", "Positive slicing", "Negative slicing", "Important string methods", "F-strings and string formatting"];
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelector("[data-list]").innerHTML = L.map((t, k) => {
      const s = k < 7 ? "done" : k === 7 ? "now" : "";
      return `<li class="${s}"><a href="#"${s === "now" ? ' aria-current="step"' : ""}><span class="mark">${s === "done" ? icon("check") : ""}</span><span><span class="n">Day ${String(k + 1).padStart(2, "0")}</span>${t}</span></a></li>`;
    }).join("");
  });
</script>
</body>
</html>
