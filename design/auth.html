<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Study with Ayaz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  body { min-height: 100vh; display: flex; flex-direction: column;
         background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px); }
  .top { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 64px; }
  .center { flex: 1; display: grid; place-items: center; padding: 24px 16px 64px; }
  .box { width: 100%; max-width: 400px; padding: 32px; display: flex; flex-direction: column; gap: 20px; }
  .box p { margin: 0; }
  .google { width: 100%; height: 44px; gap: 10px; }
  .or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; font-size: 12px; color: var(--text-3); }
  .or::before, .or::after { content: ""; height: 1px; background: var(--line-strong); }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .foot { text-align: center; font-size: 14px; color: var(--text-2); }
  .otp { display: grid; grid-template-columns: repeat(3, 1fr) 12px repeat(3, 1fr); gap: 8px; align-items: center; }
  .otp input { height: 52px; width: 100%; text-align: center; font: 500 22px/1 var(--font-mono); border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--raised); color: var(--text); }
  .otp input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .otp span { height: 1px; background: var(--text-3); }
  .method { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: var(--r-md); background: var(--sunken); font-size: 14px; color: var(--text-2); }
  .switch { display: inline-flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--sunken); font: 400 12px/1 var(--font-mono); }
  .switch button { border: 0; background: transparent; padding: 7px 10px; border-radius: 6px; color: var(--text-3); cursor: pointer; }
  .switch button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
  [data-state] { display: none; }
  body[data-show="login"] [data-state="login"], body[data-show="mfa"] [data-state="mfa"] { display: flex; }
</style>
</head>
<body data-show="login">
<header class="wrap top">
  <a class="logo" href="index.html"><svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="2.5" width="17" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 2.5v19" stroke="currentColor" stroke-width="1.5"/><path d="M11 8h6M11 12h6" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/></svg>Study with Ayaz</a>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="switch" data-single aria-label="Mockup state (do not port)">
      <button aria-pressed="true" onclick="document.body.dataset.show='login'">sign in</button>
      <button aria-pressed="false" onclick="document.body.dataset.show='mfa'">2FA step</button>
    </div>
    <button class="btn btn-ghost btn-icon theme-toggle" aria-label="Switch theme"><span data-icon="sun" class="i-sun"></span><span data-icon="moon" class="i-moon"></span></button>
  </div>
</header>

<main class="center">
  <!-- step 1: sign in -->
  <form class="panel box" data-state="login" onsubmit="event.preventDefault()">
    <div>
      <h1 class="h2">Log in</h1>
      <p class="dim small" style="margin-top:6px">Pick up the lesson where you stopped.</p>
    </div>
    <button type="button" class="btn google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <div class="or">or</div>
    <label class="field"><span class="label">Email</span><input class="input" type="email" autocomplete="email" value="hamza.rauf@gmail.com"></label>
    <label class="field">
      <span class="row"><span class="label">Password</span><a class="link small" href="#">Forgot password</a></span>
      <input class="input" type="password" autocomplete="current-password" value="••••••••••">
    </label>
    <button class="btn btn-primary btn-lg" type="submit">Log in</button>
    <p class="foot">New here? <a class="link" href="#">Create a free account</a></p>
  </form>

  <!-- step 2: two-factor code (login returned mfa_required) -->
  <form class="panel box" data-state="mfa" onsubmit="event.preventDefault()">
    <div>
      <h1 class="h2">Enter your code</h1>
      <p class="dim small" style="margin-top:6px">Open your authenticator app and type the 6-digit code for Study with Ayaz.</p>
    </div>
    <div class="otp" role="group" aria-label="6-digit code">
      <input inputmode="numeric" maxlength="1" value="4" aria-label="Digit 1"><input inputmode="numeric" maxlength="1" value="8" aria-label="Digit 2"><input inputmode="numeric" maxlength="1" value="1" aria-label="Digit 3">
      <span></span>
      <input inputmode="numeric" maxlength="1" aria-label="Digit 4"><input inputmode="numeric" maxlength="1" aria-label="Digit 5"><input inputmode="numeric" maxlength="1" aria-label="Digit 6">
    </div>
    <label class="check"><input type="checkbox">Trust this device for 30 days</label>
    <button class="btn btn-primary btn-lg" type="submit">Verify</button>
    <div class="method"><span data-icon="mail"></span><span>No phone nearby? <a class="link" href="#">Email me a code</a></span></div>
    <p class="foot"><a class="link" href="#">Use a recovery code</a> · <a href="#" class="dim">Back to log in</a></p>
  </form>
</main>
</body>
</html>
