services:
  db:
    image: postgres:16-alpine
    container_name: courses-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courses}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Host 5433 avoids clashing with a local Postgres on 5432.
    # Inside the Docker network the DB still listens on 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: courses-backend
    ports:
      - "4781:4781"
    env_file:
      - ./backend/.env
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:4780,http://127.0.0.1:4780
      FRONTEND_URL: http://localhost:4780
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-courses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courses}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4781/api/config/')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: courses-frontend
    ports:
      - "4780:4780"
    environment:
      API_BASE_URL: http://localhost:4781/api
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
