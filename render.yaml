# Render Blueprint — free Docker web service (Singapore).
# Secrets with sync:false are set in the Render dashboard only.

services:
  - type: web
    name: study-with-ayaz-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://study-with-ayaz.pages.dev"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://study-with-ayaz.pages.dev"
      - key: FRONTEND_URL
        value: "https://study-with-ayaz.pages.dev"
      - key: API_PUBLIC_URL
        value: "https://study-with-ayaz-api.onrender.com"
      - key: TURNSTILE_TEST_MODE
        value: "False"
      - key: TURNSTILE_ALLOWED_HOSTNAMES
        value: "study-with-ayaz.pages.dev"
      - key: DATABASE_URL
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: FIVERR_PROFILE_URL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
